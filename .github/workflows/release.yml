name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build release binary
        run: cargo build --release --locked
      - name: Prepare release files
        run: |
          mkdir -p dist
          cp target/release/handoff dist/handoff-linux-x86_64
          cd dist
          sha256sum handoff-linux-x86_64 > handoff-linux-x86_64.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Handoff $GITHUB_REF_NAME" \
            --generate-notes
